spring:
  application:
    name: knowledgemesh

  datasource:
    url: jdbc:postgresql://localhost:5433/knowledge_mesh
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
ai:
  ollama:
    base-url: http://localhost:11434

  embedding:
    model: nomic-embed-text

  chat:
    model: qwen3:8b

server:
  port: 8080